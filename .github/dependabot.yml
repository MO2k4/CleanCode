version: 2
updates:
  - package-ecosystem: nuget
    directory: "/src/dotnet/"
    schedule:
      interval: daily
      time: "18:10"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gradle"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
